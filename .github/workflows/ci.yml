name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test Linux (Debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            cmake \
            clang \
            libclang-dev \
            libpipewire-0.3-dev \
            libasound2-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Package Linux Debug Binaries
        run: |
          mkdir -p dist/linux-debug
          cp target/debug/listen dist/linux-debug/
          cp target/debug/ort-probe dist/linux-debug/
          cp target/debug/edge-ort-gui dist/linux-debug/
          cp target/debug/libedge_ort_runtime.so dist/linux-debug/

      - name: Upload Linux Debug Package
        uses: actions/upload-artifact@v7
        with:
          name: edge-ort-linux-debug
          path: dist/linux-debug/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android Build & Test (SDK 36)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Android Library & Debug APK
        run: ./gradlew :edge-ort-android:assembleDebug --stacktrace

      - name: Run Android Unit Tests
        run: ./gradlew :edge-ort-android:testDebugUnitTest --stacktrace

      - name: Upload Android Debug APK Package
        uses: actions/upload-artifact@v7
        with:
          name: edge-ort-android-debug-apk
          path: bindings/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
